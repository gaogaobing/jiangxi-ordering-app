name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start server and test
        run: |
          node server.js &
          sleep 2
          # 测试菜品接口
          RESPONSE=$(curl -s http://localhost:3000/api/dishes?available=1)
          echo "$RESPONSE" | grep -q '"code":0' && echo "✅ 菜品接口正常" || exit 1
          # 测试统计接口
          RESPONSE=$(curl -s http://localhost:3000/api/stats)
          echo "$RESPONSE" | grep -q '"code":0' && echo "✅ 统计接口正常" || exit 1
          # 测试下单
          RESPONSE=$(curl -s -X POST http://localhost:3000/api/orders \
            -H "Content-Type: application/json" \
            -d '{"table_number":1,"items":[{"dish_id":1,"quantity":1}]}')
          echo "$RESPONSE" | grep -q '"code":0' && echo "✅ 下单接口正常" || exit 1
          echo "🎉 所有测试通过"

  build-docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t jiangxi-ordering:latest .

      - name: Test Docker image
        run: |
          docker run -d -p 3001:3000 --name test-container jiangxi-ordering:latest
          sleep 3
          curl -s http://localhost:3001/api/dishes | grep -q '"code":0' && echo "✅ Docker容器运行正常"
          docker stop test-container && docker rm test-container

  deploy:
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy notification
        run: |
          echo "🚀 部署到生产环境"
          echo "请在服务器上执行以下命令："
          echo "  git pull origin main"
          echo "  docker-compose down && docker-compose up -d --build"
          echo "  docker-compose logs -f"
